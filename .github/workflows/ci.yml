name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mlops-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package & dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with Ruff
        run: ruff check src tests
      - name: Run Pytest suite
        run: pytest -v
      - name: Run EV Battery EOL Training & Evaluation Benchmark
        run: python -m ev_cps.model
